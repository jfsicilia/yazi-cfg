# Custom shortcuts live under the `\` prefix (like a leader key).
[mgr]
prepend_keymap = [
    { on = ["\\", "\\"],    run = "plugin split-tabs spl_toggle",     desc = "Split-tabs: toggle dual pane" },
    { on = ["\\", "<Tab>"], run = "plugin split-tabs spl_switch_tab", desc = "Split-tabs: switch pane" },
    { on = ["\\", "c"],     run = [ "escape --visual", "plugin split-tabs spl_copy" ], desc = "Split-tabs: copy to other pane" },
    { on = ["\\", "x"],     run = [ "escape --visual", "plugin split-tabs spl_move" ], desc = "Split-tabs: move to other pane" },
    { on = ["\\", "p"],     run = "plugin split-tabs spl_preview",    desc = "Split-tabs: toggle preview pane" },
    { on = ["\\", "m"],     run = "plugin split-tabs spl_maximize",   desc = "Split-tabs: maximize/restore preview" },
    { on = ["\\", "r"],     run = "plugin grug-far files",            desc = "Search & replace in selected/hovered files (grug-far)" },
    { on = ["\\", "R"],     run = "plugin grug-far workspace",        desc = "Search & replace in current folder (grug-far)" },
    { on = ["\\", "s"],     run = "plugin rg-scoped files",           desc = "Search (rg) in selected/hovered files, open hit in nvim" },
    { on = ["\\", "S"],     run = "plugin rg-scoped workspace",       desc = "Search (rg) in current folder, open hit in nvim" },
    { on = ["\\", "z"],     run = "plugin fzf-scoped all",            desc = "fzf files/folders here and below; folder: enter, file: reveal" },
    { on = ["\\", "Z"],     run = "plugin fzf-scoped dirs",           desc = "fzf folders here and below; enter it" },
    { on = ["\\", ","],     run = "shell --block -- nvim ~/.config/yazi/yazi.toml", desc = "Open yazi.toml in nvim" },
    { on = ["\\", "o"],     run = "plugin smart-enter",                desc = "Enter dir or open file" },
]
