# Custom shortcuts live under the `\` prefix (like a leader key).
[mgr]
prepend_keymap = [
    { on = ["\\", "\\"],    run = "plugin dual-pane toggle",     desc = "Dual-pane: toggle dual pane" },
    { on = ["\\", "<Tab>"], run = "plugin dual-pane switch", desc = "Dual-pane: switch pane" },
    { on = ["\\", "c"],     run = [ "escape --visual", "plugin dual-pane copy" ], desc = "Dual-pane: copy to other pane" },
    { on = ["\\", "x"],     run = [ "escape --visual", "plugin dual-pane move" ], desc = "Dual-pane: move to other pane" },
    { on = ["\\", "p"],     run = "plugin dual-pane preview",    desc = "Dual-pane: toggle preview pane" },
    { on = ["\\", "m"],     run = [ "plugin dual-pane maximize", "plugin redraw" ], desc = "Dual-pane: maximize/restore preview (then repaint)" },
    { on = ["\\", "r"],     run = "plugin grug-far files",            desc = "Search & replace in selected/hovered files (grug-far)" },
    { on = ["\\", "R"],     run = "plugin grug-far workspace",        desc = "Search & replace in current folder (grug-far)" },
    { on = ["\\", "s"],     run = "plugin rg-scoped files",           desc = "Search (rg) in selected/hovered files, open hit in nvim" },
    { on = ["\\", "S"],     run = "plugin rg-scoped workspace",       desc = "Search (rg) in current folder, open hit in nvim" },
    { on = ["\\", "z"],     run = "plugin fzf-scoped all",            desc = "fzf files/folders here and below; folder: enter, file: reveal" },
    { on = ["\\", "Z"],     run = "plugin fzf-scoped dirs",           desc = "fzf folders here and below; enter it" },
    { on = ["\\", ","],     run = "shell --block -- nvim ~/.config/yazi/yazi.toml", desc = "Open yazi.toml in nvim" },
    { on = ["\\", "o"],     run = "plugin smart-enter",                desc = "Enter dir or open file" },
    { on = ["\\", "e"],     run = "plugin ouch-archive extract",           desc = "Extract selected/hovered archives (ouch)" },
    { on = ["\\", "E"],     run = "plugin ouch-archive compress",          desc = "Compress selected/hovered files (ouch)" },
    { on = ["\\", "<Up>"],   run = "sort --reverse=no",                desc = "Sort ascending (keeps the sort method)" },
    { on = ["\\", "<Down>"], run = "sort --reverse=yes",               desc = "Sort descending (keeps the sort method)" },
    { on = ["\\", "v"],     run = "shell --block -- vimdiff.sh %s",   desc = "Diff the two selected files/folders in nvim" },
    { on = "<F5>",          run = "plugin redraw",                     desc = "Force a full repaint" },
]
