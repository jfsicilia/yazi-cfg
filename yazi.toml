#yazi.toml
[mgr]
show_hidden = true

[preview]
max_width = 3000
max_height = 3000
image_quality = 90

[plugin]
prepend_previewers = [
  { url = "*.stl", run = "stl-preview" },
  { url = "*.obj", run = "stl-preview" },
  { url = "*.gltf", run = "stl-preview" },
  { url = "*.glb", run = "stl-preview" },
  { url = "*.3mf", run = "stl-preview" },
  { url = "*.step", run = "stl-preview" },
  { url = "*.stp", run = "stl-preview" },
  { url = "*.ply", run = "stl-preview" },
  { url = "*.fbx", run = "stl-preview" }
]
